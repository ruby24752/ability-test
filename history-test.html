<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你最像哪个历史人物？</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Noto Serif SC",serif;}
body{
  background:linear-gradient(135deg,#f7f3e9 0%,#f0e8d6 100%);
  color:#333;
  padding:16px;
  min-height:100vh;
}
.container{
  max-width:480px;
  margin:0 auto;
  background:#fffdf8;
  border-radius:24px;
  padding:28px 24px;
  box-shadow:0 8px 32px rgba(140,109,49,0.15);
  border:1px solid #e9e2d3;
}
.title{
  text-align:center;
  margin-bottom:28px;
}
.title h1{
  font-size:28px;
  color:#8c6d31;
  letter-spacing:2px;
  margin-bottom:8px;
}
.title p{
  font-size:14px;
  color:#9b8870;
  letter-spacing:1px;
}
.question{
  margin:20px 0;
  padding:18px;
  border:1px solid #e9e2d3;
  border-radius:16px;
  background:#fffdf8;
}
.q-title{
  font-size:16px;
  font-weight:600;
  margin-bottom:14px;
  color:#5c4a2e;
  line-height:1.5;
}
.option{
  padding:14px 16px;
  border:1.5px solid #e5dcc8;
  border-radius:12px;
  margin:10px 0;
  cursor:pointer;
  transition:all 0.2s;
  font-size:15px;
  line-height:1.6;
  background:#fff;
  word-break:break-word;
}
.option:hover{
  background:#f9f4e8;
  border-color:#c9b89c;
}
.option.active{
  background:linear-gradient(135deg,#d4c3a8 0%,#c9b89c 100%);
  color:#fff;
  border-color:#b89968;
}
.btnbox{
  text-align:center;
  margin-top:28px;
}
button{
  padding:14px 40px;
  background:linear-gradient(135deg,#8c6d31 0%,#6d5424 100%);
  color:#fff;
  border:none;
  border-radius:999px;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(140,109,49,0.3);
  letter-spacing:2px;
  font-family:inherit;
}
button:active{
  transform:translateY(2px);
  box-shadow:0 2px 6px rgba(140,109,49,0.3);
}
#result{display:none;}
.result-card{
  border:1px solid #d9cbb7;
  border-radius:20px;
  padding:24px 20px;
  background:linear-gradient(180deg,#fffaf0 0%,#f9f0dc 100%);
}
.name{
  font-size:40px;
  text-align:center;
  color:#8c5e22;
  font-weight:700;
  letter-spacing:8px;
  margin-bottom:8px;
}
.subtitle{
  text-align:center;
  font-size:14px;
  color:#9b8870;
  margin-bottom:16px;
}
.tag-wrap{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:16px 0;
  flex-wrap:wrap;
}
.tag{
  padding:6px 14px;
  background:rgba(140,109,49,0.1);
  border-radius:999px;
  font-size:13px;
  color:#664f2e;
  border:1px solid rgba(140,109,49,0.2);
}
.canvas-box{
  width:260px;
  height:260px;
  margin:20px auto;
  position:relative;
}
.desc{
  line-height:1.8;
  margin:20px 0;
  font-size:15px;
  color:#5c4a2e;
  text-align:justify;
}
.tip{
  text-align:center;
  font-size:12px;
  color:#9b8870;
  margin-top:20px;
  padding-top:16px;
  border-top:1px dashed #d9cbb7;
}
</style>
</head>
<body>
<div class="container">
  <div id="quiz">
    <div class="title">
      <h1>你最像哪个历史人物</h1>
      <p>以史为镜，照见你的灵魂底色</p>
    </div>
    <div id="q-box"></div>
    <div class="btnbox">
      <button onclick="calcResult()">查看我的人物</button>
    </div>
  </div>

  <div id="result">
    <div class="result-card">
      <div class="name" id="heroName"></div>
      <p class="subtitle">—— 你的灵魂底色 ——</p>
      <div class="tag-wrap" id="heroTags"></div>
      <div class="canvas-box">
        <canvas id="radarChart"></canvas>
      </div>
      <div class="desc" id="heroDesc"></div>
      <p class="tip">* 结果仅供娱乐参考</p>
    </div>
    <div class="btnbox" style="margin-top:20px;">
      <button onclick="resetQuiz()">重新测试</button>
    </div>
  </div>
</div>

<script>
const questions = [
  {q:"遇到难题，你优先？",o:[
    {t:"周密谋划，评估所有风险",s:[3,1,1,1,2]},
    {t:"果断出手，边做边调整",s:[1,3,1,1,2]},
    {t:"顾全大局，顾及他人感受",s:[1,1,3,2,1]},
    {t:"梳理道理，用文字思路破局",s:[1,1,2,3,1]}
  ]},
  {q:"团队里你更像？",o:[
    {t:"制定全局规划，把控方向",s:[2,1,1,2,3]},
    {t:"攻坚执行者，冲锋在前",s:[1,3,1,1,2]},
    {t:"调和矛盾，照顾大家情绪",s:[1,1,3,2,1]},
    {t:"输出观点，整理总结经验",s:[2,1,2,3,1]}
  ]},
  {q:"面对反对声音，你一般？",o:[
    {t:"坚持自己的判断，强力推进",s:[2,3,1,1,2]},
    {t:"理性辩论，讲道理说服对方",s:[3,1,1,3,1]},
    {t:"包容不同意见，求同存异",s:[1,1,3,2,2]},
    {t:"暂时搁置，等待合适时机",s:[3,1,2,1,2]}
  ]},
  {q:"闲暇时间更喜欢？",o:[
    {t:"读史书、思考局势",s:[3,1,1,3,2]},
    {t:"运动、挑战有难度的事",s:[1,3,1,1,1]},
    {t:"陪伴亲友，待人处事",s:[1,1,3,2,1]},
    {t:"写字、阅读、文学创作",s:[1,1,2,3,1]}
  ]},
  {q:"做一件大事，你最看重？",o:[
    {t:"最终结果，能否达成目标",s:[2,2,1,1,3]},
    {t:"行事道义，守住本心底线",s:[1,1,3,2,1]},
    {t:"谋略布局，步步稳妥",s:[3,1,1,2,2]},
    {t:"过程体验，留下思想文字",s:[1,1,2,3,1]}
  ]},
  {q:"面对挫折失败，你会？",o:[
    {t:"快速复盘，调整策略再战",s:[3,2,1,1,2]},
    {t:"积蓄力量，等待时机翻盘",s:[2,3,1,1,1]},
    {t:"反思自身，自省修养德行",s:[1,1,3,2,1]},
    {t:"看淡得失，用文字抒发心境",s:[1,1,2,3,1]}
  ]},
  {q:"交朋友，你更欣赏？",o:[
    {t:"足智多谋，眼光长远",s:[3,1,2,2,1]},
    {t:"果敢勇猛，讲义气",s:[1,3,2,1,1]},
    {t:"宽厚仁善，品行端正",s:[1,1,3,2,1]},
    {t:"博学多才，谈吐风雅",s:[1,1,2,3,1]}
  ]},
  {q:"你做选择时，更多依靠？",o:[
    {t:"理性推演，利弊计算",s:[3,1,1,2,2]},
    {t:"胆识魄力，相信直觉",s:[1,3,1,1,2]},
    {t:"良知与内心道德标准",s:[1,1,3,2,1]},
    {t:"过往学识、书本经验",s:[1,1,2,3,1]}
  ]},
  {q:"在集体中推行想法，你习惯？",o:[
    {t:"自上而下，强力落地",s:[2,3,1,1,3]},
    {t:"娓娓道来，以理服人",s:[3,1,1,3,1]},
    {t:"以德感召，慢慢影响他人",s:[1,1,3,2,2]},
    {t:"写文章传播，获得认同",s:[1,1,2,3,1]}
  ]},
  {q:"评价一个人，你优先看？",o:[
    {t:"能力谋略，能否成事",s:[3,2,1,1,1]},
    {t:"气节风骨，品行德行",s:[1,1,3,2,1]},
    {t:"文采思想，见识格局",s:[1,1,2,3,1]},
    {t:"魄力担当，敢做决断",s:[1,3,1,1,2]}
  ]},
  {q:"理想的人生状态是？",o:[
    {t:"建功立业，开创格局",s:[2,3,1,1,3]},
    {t:"内心通透，精神富足",s:[1,1,2,3,1]},
    {t:"守正向善，惠及他人",s:[1,1,3,2,1]},
    {t:"运筹帷幄，掌控全局",s:[3,2,1,1,2]}
  ]},
  {q:"如果可以，你更想拥有？",o:[
    {t:"无双谋略，洞悉世事",s:[3,1,1,2,2]},
    {t:"盖世魄力，一往无前",s:[1,3,1,1,2]},
    {t:"宽厚德行，万人信服",s:[1,1,3,2,1]},
    {t:"旷世文采，流传千古",s:[1,1,2,3,1]}
  ]},
  {q:"你更喜欢哪种生活节奏？",o:[
    {t:"快节奏，不断挑战新目标",s:[2,3,1,1,3]},
    {t:"慢节奏，有时间思考和沉淀",s:[1,1,2,3,2]},
    {t:"有规律，按计划稳步推进",s:[2,1,3,2,2]},
    {t:"无拘束，随遇而安",s:[1,3,1,3,1]}
  ]},
  {q:"团队遇到危机，你第一反应是？",o:[
    {t:"立刻制定应急方案，组织应对",s:[3,2,1,1,3]},
    {t:"冲在最前面，承担最危险的部分",s:[1,3,1,1,2]},
    {t:"安抚大家情绪，稳定军心",s:[1,1,3,2,1]},
    {t:"分析问题根源，给出解决思路",s:[2,1,2,3,1]}
  ]},
  {q:"你更相信哪种成功方式？",o:[
    {t:"天时地利，顺势而为",s:[3,2,1,1,2]},
    {t:"人定胜天，敢拼才会赢",s:[1,3,1,1,2]},
    {t:"厚德载物，德行到位自然成",s:[1,1,3,2,1]},
    {t:"学识积累，厚积薄发",s:[2,1,2,3,1]}
  ]},
  {q:"面对不公平的事，你会？",o:[
    {t:"想办法改变规则，制定新秩序",s:[2,3,1,1,3]},
    {t:"当面指出，据理力争",s:[1,3,3,1,1]},
    {t:"调整心态，尽人事听天命",s:[1,1,2,3,1]},
    {t:"用策略迂回，慢慢改变现状",s:[3,1,2,2,2]}
  ]},
  {q:"如果写一本自传，书名更可能叫？",o:[
    {t:"《我的帝国版图》",s:[2,3,1,1,3]},
    {t:"《东坡居士全集》",s:[1,1,2,3,1]},
    {t:"《千秋功过任评说》",s:[3,2,3,1,2]},
    {t:"《将进酒》",s:[1,3,1,3,1]}
  ]},
  {q:"你觉得以下哪个词最能代表你？",o:[
    {t:"谋",s:[3,1,1,2,2]},
    {t:"勇",s:[1,3,1,1,2]},
    {t:"仁",s:[1,1,3,2,1]},
    {t:"雅",s:[1,1,2,3,1]}
  ]}
];

const heroList = [
  {name:"秦始皇",tags:["铁腕定鼎","雷厉风行","宏图霸业"],desc:"你自带宏大格局，目标感极强，做事果决有魄力，擅长统筹全局。拥有开创格局的野心，行事坚定，一旦定下方向便会全力推进，不轻易被外界声音动摇。",score:[2,3,1,1,3]},
  {name:"苏轼",tags:["旷达通透","文采斐然","随遇而安"],desc:"内心丰盈，善于从生活中寻找诗意。文采与共情力突出，遭遇困境也能保持乐观，包容力强，自带温润松弛的气质，懂得在平凡日子里发现美好。",score:[1,1,2,3,1]},
  {name:"武则天",tags:["智计过人","杀伐果断","胸怀天下"],desc:"心思缜密，擅长权衡利弊，意志坚韧。拥有极强的大局观，懂得审时度势，为目标可以隐忍蓄力，在关键时刻总能做出最有利的选择。",score:[3,2,1,1,3]},
  {name:"诸葛亮",tags:["神机妙算","忠正守德","文韬武略"],desc:"擅长谋划布局，思虑周全，坚守内心道义。兼具文采与谋略，做事谨慎稳重，愿意为信念长久付出，是值得信赖的核心人物。",score:[3,1,3,3,2]},
  {name:"李白",tags:["豪迈洒脱","浪漫不羁","风骨傲然"],desc:"天性浪漫，想象力充沛，向往自由。敢于表达自我，有一往无前的意气，不喜拘束，热爱精神层面的美好，自带少年意气的鲜活感。",score:[1,3,1,3,1]},
  {name:"曾国藩",tags:["隐忍自持","修身立德","稳扎稳打"],desc:"重视自省与德行修炼，不追求速成。擅长厚积薄发，稳扎稳打，懂得收敛锋芒，在日复一日的磨砺中持续成长，大器晚成。",score:[2,1,3,2,2]}
];

let userAnswers = Array(questions.length).fill(null);
let score = [0,0,0,0,0];

function renderQuiz(){
  const box = document.getElementById('q-box');
  box.innerHTML = "";
  questions.forEach((item,idx)=>{
    let html = `<div class="question"><div class="q-title">第${idx+1}题 / 共${questions.length}题<br><br>${item.q}</div>`;
    item.o.forEach((opt,oi)=>{
      html += `<div class="option ${userAnswers[idx]===oi?'active':''}" onclick="pick(${idx},${oi})">${opt.t}</div>`
    })
    html += "</div>";
    box.innerHTML += html;
  })
}
function pick(qIdx,oIdx){
  userAnswers[qIdx]=oIdx;
  renderQuiz();
}
function calcResult(){
  score = [0,0,0,0,0];
  for(let i=0;i<questions.length;i++){
    const optIdx = userAnswers[i];
    if(optIdx===null){alert("请完成全部题目再查看结果哦～");return;}
    const sArr = questions[i].o[optIdx].s;
    score[0]+=sArr[0];score[1]+=sArr[1];score[2]+=sArr[2];score[3]+=sArr[3];score[4]+=sArr[4];
  }
  let minDis = Infinity;
  let targetHero = heroList[0];
  heroList.forEach(h=>{
    let d = 0;
    for(let i=0;i<5;i++) d += Math.pow(score[i]-h.score[i],2);
    if(d<minDis){minDis=d;targetHero=h;}
  })
  document.getElementById('quiz').style.display="none";
  document.getElementById('result').style.display="block";
  document.getElementById('heroName').innerText = targetHero.name;
  document.getElementById('heroTags').innerHTML = targetHero.tags.map(t=>`<span class="tag">${t}</span>`).join("");
  document.getElementById('heroDesc').innerText = targetHero.desc;
  const ctx = document.getElementById('radarChart').getContext('2d');
  new Chart(ctx,{type:'radar',data:{
    labels:["谋略","勇武","德行","文采","统御"],
    datasets:[{label:"你的特质",data:score,backgroundColor:'rgba(140,109,49,0.15)',borderColor:'#8c6d31',pointBackgroundColor:'#8c6d31',borderWidth:2}]
  },options:{scales:{r:{min:0,max:45,ticks:{display:false},grid:{color:'rgba(140,109,49,0.2)'},angleLines:{color:'rgba(140,109,49,0.2)'},pointLabels:{color:'#664f2e',font:{size:14}}}}}})
  window.scrollTo(0,0);
}
function resetQuiz(){
  userAnswers = Array(questions.length).fill(null);
  renderQuiz();
  document.getElementById('quiz').style.display="block";
  document.getElementById('result').style.display="none";
  window.scrollTo(0,0);
}
renderQuiz();
</script>
</body>
</html>
