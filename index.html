<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>儿童多元智能趣味测评</title>
<link href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root{
  --cream:#FFF6DE;
  --card:#FFFFFF;
  --ink:#3D2E1F;
  --ink-2:#6B5844;
  --ink-3:#9B8870;
  --line:#F0DFB8;
  --accent:#FF8A3D;
  --accent-dark:#D65E15;
  --lang:#F5C542;
  --logic:#6BCB77;
  --space:#FF9F45;
  --body:#FF6B6B;
  --music:#FF8FB1;
  --social:#A78BFA;
  --self:#6C8CFF;
  --nature:#8FAE5D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}
.app{
  width:100%;max-width:480px;height:100svh;
  margin:0 auto;display:flex;flex-direction:column;
  padding:16px 18px;
  position:relative;
}
.view{display:none;flex-direction:column;height:100%;}
.view.active{display:flex;animation:fadeUp .4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:12px;margin-bottom:8px;
}
.top-bar .back{font-size:22px;color:var(--ink-2);cursor:pointer;}
.top-bar .title{font-size:17px;font-weight:700;color:var(--ink);}
.top-bar .share{font-size:18px;color:var(--ink-2);cursor:pointer;}

/* ===== 首页 ===== */
#view-start{align-items:center;justify-content:flex-start;text-align:center;padding-top:10px;}
.dino-img{
  width:130px;height:auto;margin:8px 0 14px;
  filter:drop-shadow(0 6px 0 rgba(230,184,74,.2));
  mix-blend-mode:multiply;
}
.title-big{font-size:30px;font-weight:900;line-height:1.3;margin-bottom:8px;color:var(--ink);}
.title-big em{font-style:normal;color:var(--accent);}
.sub-big{font-size:14px;color:var(--ink-2);margin-bottom:24px;}
.tag-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  margin-bottom:32px;width:100%;
}
.tag-item{
  background:var(--card);border-radius:16px;
  padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 2px 0 var(--line);
}
.tag-item .icon{font-size:22px;}
.tag-item .text{font-size:13px;color:var(--ink-2);font-weight:700;}
.btn-main{
  display:inline-flex;align-items:center;justify-content:center;
  padding:15px 50px;border:none;border-radius:999px;
  background:linear-gradient(145deg,#FF9F45,#FF7A2E);color:#fff;
  font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;
  box-shadow:0 5px 0 var(--accent-dark);
  width:100%;max-width:320px;
}
.btn-main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-dark);}
.tip-small{margin-top:14px;font-size:12px;color:var(--ink-3);}

/* ===== 答题页 ===== */
.q-progress-label{
  display:flex;justify-content:space-between;
  font-size:13px;color:var(--ink-2);margin-bottom:6px;
}
.q-progress-bar{
  height:8px;background:#FFEDBE;border-radius:999px;overflow:hidden;
  margin-bottom:16px;
}
.q-progress-bar i{
  display:block;height:100%;
  background:linear-gradient(90deg,#FFB84D,#FF8A3D);
  border-radius:999px;transition:width .3s;
}
.q-dim-label{
  font-size:14px;color:var(--accent);font-weight:700;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.q-card{
  background:var(--card);border-radius:20px;padding:20px 18px;
  box-shadow:0 4px 0 var(--line);margin-bottom:16px;
}
.q-text{font-size:18px;line-height:1.7;color:var(--ink);font-weight:700;}
.q-dino-tip{
  margin-top:12px;font-size:13px;color:var(--ink-3);
  display:flex;align-items:center;gap:6px;
}
.opts{display:flex;flex-direction:column;gap:10px;flex:1;}
.opt{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-radius:16px;
  background:var(--card);border:3px solid var(--line);
  font-family:inherit;font-size:16px;color:var(--ink);
  cursor:pointer;text-align:left;transition:all .2s;
}
.opt .key{
  flex:none;width:32px;height:32px;border-radius:10px;
  display:grid;place-items:center;font-size:14px;font-weight:900;
  background:#FFEDBE;color:var(--ink-2);
}
.opt.picked{border-color:var(--accent);background:#FFE8CC;}
.opt.picked .key{background:var(--accent);color:#fff;}
.q-foot{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:12px;padding-bottom:8px;
}
.btn-ghost{
  padding:10px 22px;border-radius:999px;border:2px solid var(--line);
  background:var(--card);font-family:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;
}
.btn-ghost:disabled{opacity:.4;}
.btn-next{
  padding:10px 24px;border-radius:999px;border:none;
  background:var(--accent);color:#fff;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;
  box-shadow:0 3px 0 var(--accent-dark);
}
.btn-next:disabled{opacity:.4;box-shadow:none;}

/* ===== 雷达图结果页 ===== */
#view-radar{align-items:center;text-align:center;}
.result-badge{
  padding:8px 20px;border-radius:999px;background:var(--card);
  border:2px solid var(--line);font-size:14px;color:var(--ink-2);margin-bottom:12px;
}
.result-badge b{color:var(--accent);}
.result-title{font-size:24px;font-weight:900;margin-bottom:4px;}
.result-sub{font-size:13px;color:var(--ink-2);margin-bottom:16px;}
.radar-wrap{
  width:100%;max-width:320px;height:320px;
  background:var(--card);border-radius:20px;
  box-shadow:0 4px 0 var(--line);padding:10px;margin-bottom:16px;
}
.top2{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
.top-tag{
  padding:6px 14px;border-radius:12px;font-size:13px;font-weight:700;color:#fff;
}

/* ===== 分项报告页 ===== */
.report-head{text-align:center;margin-bottom:14px;}
.report-head h2{font-size:22px;font-weight:900;margin-bottom:4px;}
.report-head p{font-size:13px;color:var(--ink-2);}
.report-list{
  flex:1;overflow-y:auto;padding-bottom:8px;
  display:flex;flex-direction:column;gap:10px;
}
.report-item{
  background:var(--card);border-radius:16px;padding:14px;
  box-shadow:0 3px 0 var(--line);
  border-left:6px solid var(--item-c,var(--accent));
}
.ri-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.ri-icon{
  width:34px;height:34px;border-radius:10px;
  display:grid;place-items:center;font-size:18px;flex:none;
}
.ri-name{font-size:15px;font-weight:900;flex:1;}
.ri-score{font-size:13px;font-weight:700;color:var(--ink-2);}
.ri-bar{
  height:6px;background:#FFEDBE;border-radius:999px;
  overflow:hidden;margin-bottom:6px;
}
.ri-bar i{display:block;height:100%;border-radius:999px;}
.ri-desc{font-size:13px;color:var(--ink-2);line-height:1.6;}
.ri-level{
  display:inline-block;padding:2px 8px;border-radius:999px;
  font-size:11px;font-weight:700;color:#fff;margin-left:4px;
}

/* ===== 养育建议页 ===== */
#view-advice{position:relative;}
.advice-content{
  flex:1;overflow-y:auto;padding-bottom:16px;
}
.advice-title{
  text-align:center;font-size:24px;font-weight:900;color:var(--ink);
  margin-bottom:6px;
}
.advice-subtitle{
  text-align:center;font-size:15px;color:var(--ink-2);margin-bottom:16px;
}
.advice-tagline{
  text-align:center;font-size:14px;color:#C98A4B;margin-bottom:20px;
}
#adviceList{
  display:flex;flex-direction:column;gap:14px;
}
.advice-card{
  background:var(--card);border-radius:20px;padding:20px 18px;
  box-shadow:0 4px 0 rgba(240,223,184,.6);
  border-top:4px solid var(--accent);
}
.advice-card h3{
  font-size:17px;font-weight:900;color:var(--accent);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.advice-card h3 .dot{
  width:10px;height:10px;border-radius:50%;background:var(--accent);
  display:inline-block;
}
.advice-card ul{
  list-style:none;padding:0;display:flex;flex-direction:column;gap:10px;
}
.advice-card li{
  font-size:14px;color:var(--ink-2);line-height:1.6;padding-left:16px;
  position:relative;
}
.advice-card li::before{
  content:"◆";position:absolute;left:0;color:var(--accent);font-size:12px;
}
.advice-tag{
  display:inline-block;background:#E8F5E9;color:#4CAF50;
  padding:6px 14px;border-radius:12px;font-size:13px;
  margin-bottom:10px;
}
.tip-box{
  background:#E8F5E9;border-radius:16px;padding:14px 16px;
  font-size:13px;color:#2E7D32;line-height:1.6;margin-top:16px;
}
.advice-foot{
  display:flex;justify-content:space-between;gap:12px;
  padding-top:12px;
}
.advice-foot .btn-ghost{
  flex:1;padding:12px;border-radius:999px;
  border:2px solid var(--line);background:var(--card);
  font-family:inherit;font-size:15px;color:var(--ink-2);cursor:pointer;
}
.advice-foot .btn-next{
  flex:1;padding:12px;border-radius:999px;border:none;
  background:var(--accent);color:#fff;font-family:inherit;
  font-size:16px;font-weight:900;cursor:pointer;
  box-shadow:0 4px 0 var(--accent-dark);
}
</style>
</head>
<body>
<div class="app">

  <!-- 首页 -->
  <section class="view active" id="view-start" style="padding:0;overflow:hidden;">
    <div style="position:relative;width:100%;height:100%;">
      <img src="https://aka.doubaocdn.com/s/YPQoTOfEKq" style="width:100%;height:100%;object-fit:cover;" alt="儿童多元智能趣味测评">
      <div id="btnStart" style="position:absolute;bottom:8%;left:50%;transform:translateX(-50%);width:70%;height:11%;cursor:pointer;"></div>
    </div>
  </section>

  <!-- 答题页 -->
  <section class="view" id="view-quiz">
    <div class="top-bar">
      <span class="back" onclick="goBack()">✕</span>
      <span class="title">儿童多元智能趣味测评</span>
      <span class="share">↗</span>
    </div>
    <div class="q-progress-label">
      <span id="qNum">第 1 题 / 16 题</span>
      <span id="qPct">6%</span>
    </div>
    <div class="q-progress-bar"><i id="qBar" style="width:6%"></i></div>
    <div class="q-dim-label" id="qEyebrow">📖 语言智能</div>
    <div class="q-card">
      <div class="q-text" id="qText">题目加载中…</div>
      <div class="q-dino-tip">🦖 小恐龙：认真想一想哦～</div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="q-foot">
      <button class="btn-ghost" id="btnPrev">← 上一题</button>
      <button class="btn-next" id="btnNext" disabled>下一题 →</button>
    </div>
  </section>

  <!-- 雷达图结果页 -->
  <section class="view" id="view-radar">
    <div class="top-bar">
      <span class="back">✕</span>
      <span class="title">测评结果</span>
      <span class="share">↗</span>
    </div>
    <div class="result-badge">测评完成 · 你的孩子是 <b id="topType">—</b> 型小天才</div>
    <h2 class="result-title">✨ 天赋雷达图</h2>
    <p class="result-sub">八个维度一览，颜色越高越擅长</p>
    <div class="radar-wrap" id="radarChart"></div>
    <div class="top2" id="topTags"></div>
    <button class="btn-main" id="btnReport">查看完整报告 →</button>
  </section>

  <!-- 分项报告页 -->
  <section class="view" id="view-report">
    <div class="top-bar">
      <span class="back" onclick="showView('view-radar')">✕</span>
      <span class="title">能力报告</span>
      <span class="share">↗</span>
    </div>
    <div class="report-head">
      <h2>📊 八项能力报告</h2>
      <p>根据作答自动生成，分数越高越擅长</p>
    </div>
    <div class="report-list" id="reportList"></div>
    <div class="q-foot">
      <button class="btn-ghost" onclick="showView('view-radar')">← 雷达图</button>
      <button class="btn-next" onclick="showView('view-advice')">养育建议 →</button>
    </div>
  </section>

  <!-- 养育建议页 -->
  <section class="view" id="view-advice">
    <div class="top-bar">
      <span class="back" onclick="showView('view-report')">✕</span>
      <span class="title">儿童多元智能趣味测评</span>
      <span class="share">↗</span>
    </div>
    <div class="advice-content">
      <h2 class="advice-title">🌱 个性化养育建议</h2>
      <p class="advice-subtitle">围绕孩子的优势方向培养</p>
      <p class="advice-tagline">每个孩子都有自己的成长节奏</p>
      <div id="adviceList"></div>
      <div class="tip-box">
        温馨提示：测评结果仅作为兴趣观察参考，不代表固定能力定论。
      </div>
    </div>
    <div class="advice-foot">
      <button class="btn-ghost" onclick="showView('view-report')">返回报告</button>
      <button class="btn-next" onclick="restart()">重新测一次</button>
    </div>
  </section>

</div>

<script>
const INTELLIGENCES = [
  { key:'lang',  name:'语言智能',   icon:'📖', color:'#F5C542', desc:'爱讲故事、表达清楚、识字早、记忆力强', career:'小记者 / 作家 / 主持人 / 律师' },
  { key:'logic', name:'逻辑-数学', icon:'🧮', color:'#6BCB77', desc:'爱问为什么、喜欢找规律、下棋解谜、做事有条理', career:'科学家 / 程序员 / 工程师 / 金融分析' },
  { key:'space', name:'空间智能',   icon:'🎨', color:'#FF9F45', desc:'爱画画搭积木、想象力丰富、方向感好', career:'画家 / 设计师 / 建筑师 / 摄影师' },
  { key:'body',  name:'身体动觉',   icon:'🏃', color:'#FF6B6B', desc:'爱运动、肢体协调、模仿力强、动手能力好', career:'运动员 / 舞蹈家 / 演员 / 外科医生' },
  { key:'music', name:'音乐智能',   icon:'🎵', color:'#FF8FB1', desc:'听到音乐就摇摆、爱哼唱、节奏感好', career:'歌手 / 作曲家 / 乐手 / 音乐制作' },
  { key:'social',name:'人际智能',   icon:'🤝', color:'#A78BFA', desc:'会交朋友、会照顾人情绪、是孩子王', career:'教师 / 心理咨询师 / 公关 / 领导者' },
  { key:'self',  name:'内省智能',   icon:'🪞', color:'#6C8CFF', desc:'喜欢独立思考、清楚自己喜好、自控力强', career:'哲学家 / 研究员 / 作家 / 独立创作者' },
  { key:'nature',name:'自然智能',   icon:'🌱', color:'#8FAE5D', desc:'喜欢动植物、爱户外观察、收集树叶石头', career:'生物学家 / 兽医 / 园艺师 / 环保专家' }
];

const QUESTIONS = [
  { dim:'lang',  q:'孩子很喜欢讲故事，很早就认识不少字'},
  { dim:'lang',  q:'复述故事细节记得很牢，玩词语接龙很厉害'},
  { dim:'logic', q:'总喜欢追问事物原理，对数字、拼图解谜很感兴趣'},
  { dim:'logic', q:'遇到问题喜欢梳理先后顺序，喜欢棋类游戏'},
  { dim:'space', q:'爱画画、搭积木，看图就能脑补出画面，不容易迷路'},
  { dim:'space', q:'随手就爱涂鸦，能看懂地图、搭建复杂积木造型'},
  { dim:'body',  q:'肢体协调性好，喜欢跑跳、模仿动作，爱拆小东西研究'},
  { dim:'body',  q:'运动、跳舞时平衡感好，动手手工做得不错'},
  { dim:'music', q:'听到音乐会跟着哼唱摇摆，对声音、旋律很敏感'},
  { dim:'music', q:'听一遍旋律就能记住，能分辨音调高低'},
  { dim:'social',q:'很会照顾小伙伴情绪，喜欢组织小朋友一起玩游戏'},
  { dim:'social',q:'能察觉到别人情绪变化，小伙伴愿意找他倾诉'},
  { dim:'self',  q:'习惯独自安静思考，清楚自己喜欢什么，情绪稳定自控好'},
  { dim:'self',  q:'有自己的小目标，愿意写日记记录心情想法'},
  { dim:'nature',q:'喜欢去户外观察花草小动物，会收集树叶、石头'},
  { dim:'nature',q:'留意四季变化，喜欢观察昆虫、植物生长'}
];

const OPTIONS = [
  { label:'A', text:'非常符合', val:4 },
  { label:'B', text:'比较符合', val:3 },
  { label:'C', text:'偶尔符合', val:2 },
  { label:'D', text:'不太符合', val:1 }
];

const G = { qIndex:0, answers:new Array(QUESTIONS.length).fill(null) };
let radarChart = null;
let audioCtx = null;

function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goBack(){
  if(G.qIndex > 0){ G.qIndex--; renderQuestion(); }
  else { showView('view-start'); }
}

function playDing(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const o1 = audioCtx.createOscillator();
  const g1 = audioCtx.createGain();
  o1.type='sine'; o1.frequency.value=880;
  g1.gain.setValueAtTime(0.001,now);
  g1.gain.exponentialRampToValueAtTime(0.15,now+0.01);
  g1.gain.exponentialRampToValueAtTime(0.001,now+0.2);
  o1.connect(g1); g1.connect(audioCtx.destination);
  o1.start(now); o1.stop(now+0.25);
  const o2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  o2.type='sine'; o2.frequency.value=440;
  g2.gain.setValueAtTime(0.001,now+0.1);
  g2.gain.exponentialRampToValueAtTime(0.12,now+0.11);
  g2.gain.exponentialRampToValueAtTime(0.001,now+0.3);
  o2.connect(g2); g2.connect(audioCtx.destination);
  o2.start(now+0.1); o2.stop(now+0.35);
}

function renderQuestion(){
  const i = G.qIndex;
  const q = QUESTIONS[i];
  const dim = INTELLIGENCES.find(d=>d.key===q.dim);
  document.getElementById('qNum').textContent = `第 ${i+1} 题 / ${QUESTIONS.length} 题`;
  const pct = Math.round((i+1)/QUESTIONS.length*100);
  document.getElementById('qPct').textContent = pct+'%';
  document.getElementById('qBar').style.width = pct+'%';
  document.getElementById('qEyebrow').textContent = dim.icon+' '+dim.name;
  document.getElementById('qText').textContent = q.q+'？';
  const optsEl = document.getElementById('opts');
  optsEl.innerHTML = '';
  OPTIONS.forEach((o,idx)=>{
    const b = document.createElement('button');
    b.className = 'opt'+(G.answers[i]===idx?' picked':'');
    b.innerHTML = `<span class="key">${o.label}</span><span>${o.text}</span>`;
    b.onclick = ()=>{
      G.answers[i] = idx;
      document.querySelectorAll('.opt').forEach(x=>x.classList.remove('picked'));
      b.classList.add('picked');
      document.getElementById('btnNext').disabled = false;
    };
    optsEl.appendChild(b);
  });
  document.getElementById('btnPrev').disabled = (i===0);
  const btnNext = document.getElementById('btnNext');
  btnNext.disabled = (G.answers[i]===null);
  btnNext.textContent = (i===QUESTIONS.length-1) ? '查看结果 →' : '下一题 →';
}

document.getElementById('btnStart').onclick = ()=>{
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  G.qIndex=0; renderQuestion(); showView('view-quiz');
};
document.getElementById('btnPrev').onclick = ()=>{ if(G.qIndex>0){ G.qIndex--; renderQuestion(); } };
document.getElementById('btnNext').onclick = ()=>{
  if(G.answers[G.qIndex]===null) return;
  playDing();
  if(G.qIndex < QUESTIONS.length-1){ G.qIndex++; renderQuestion(); }
  else{ finishQuiz(); }
};

function calcScores(){
  const s = {};
  INTELLIGENCES.forEach(d=>s[d.key]=0);
  QUESTIONS.forEach((q,i)=>{ if(G.answers[i]!==null) s[q.dim] += OPTIONS[G.answers[i]].val; });
  return s;
}

function finishQuiz(){
  const scores = calcScores();
  const sorted = INTELLIGENCES.slice().sort((a,b)=>scores[b.key]-scores[a.key]);
  const top1 = sorted[0], top2 = sorted[1];
  document.getElementById('topType').textContent = top1.name.replace('智能','');
  document.getElementById('topTags').innerHTML =
    `<span class="top-tag" style="background:${top1.color}">🥇 ${top1.name} · ${scores[top1.key]}分</span>`+
    `<span class="top-tag" style="background:${top2.color}">🥈 ${top2.name} · ${scores[top2.key]}分</span>`;
  renderRadar(scores);
  renderReport(scores);
  renderAdvice(scores, sorted);
  showView('view-radar');
}

function renderRadar(scores){
  const el = document.getElementById('radarChart');
  if(!radarChart) radarChart = echarts.init(el);
  radarChart.setOption({
    radar:{
      indicator: INTELLIGENCES.map(d=>({name:d.name.replace('智能',''), max:8})),
      radius:'65%', center:['50%','52%'],
      axisName:{ color:'#6B5844', fontSize:12, fontFamily:'ZCOOL KuaiLe' },
      splitArea:{ areaStyle:{ color:['#FFF8E7','#FFF3D0','#FFEDBE'] } },
      splitLine:{ lineStyle:{ color:'#E8D5A8' } },
      axisLine:{ lineStyle:{ color:'#E8D5A8' } }
    },
    series:[{
      type:'radar',
      data:[{
        value: INTELLIGENCES.map(d=>scores[d.key]),
        areaStyle:{ color:'rgba(255,138,61,.35)' },
        lineStyle:{ color:'#FF8A3D', width:3 },
        itemStyle:{ color:'#FF8A3D' }
      }]
    }]
  });
  setTimeout(()=>radarChart.resize(), 100);
}

function levelOf(s){
  if(s>=7) return {t:'非常擅长', c:'#6BCB77'};
  if(s>=5) return {t:'有些擅长', c:'#F5C542'};
  if(s>=3) return {t:'一般水平', c:'#FF9F45'};
  return {t:'有待提升', c:'#FF6B6B'};
}
function renderReport(scores){
  const list = document.getElementById('reportList');
  list.innerHTML = '';
  INTELLIGENCES.forEach(d=>{
    const s = scores[d.key];
    const lv = levelOf(s);
    const pct = Math.round(s/8*100);
    const div = document.createElement('div');
    div.className = 'report-item';
    div.style.setProperty('--item-c', d.color);
    div.innerHTML = `
      <div class="ri-top">
        <div class="ri-icon" style="background:${d.color}22">${d.icon}</div>
        <div class="ri-name">${d.name}<span class="ri-level" style="background:${lv.c}">${lv.t}</span></div>
        <div class="ri-score">${s}/8 分</div>
      </div>
      <div class="ri-bar"><i style="width:${pct}%;background:${d.color}"></i></div>
      <div class="ri-desc">${d.desc}<br>💡 适合方向：${d.career}</div>`;
    list.appendChild(div);
  });
}

function renderAdvice(scores, sorted){
  const top2 = sorted.slice(0,2);
  const list = document.getElementById('adviceList');
  list.innerHTML = '';
  
  const c1 = document.createElement('div');
  c1.className = 'advice-card';
  c1.innerHTML = `
    <span class="advice-tag">每个孩子都有自己的成长节奏</span>
    <h3><span class="dot"></span>优势方向 · 重点培养</h3>
    <ul>${top2.map(d=>`<li><b style="color:${d.color}">${d.icon}${d.name}</b>：${d.desc}，可以多接触 ${d.career.split(' / ')[0]} 相关的活动和兴趣班。</li>`).join('')}</ul>
  `;
  list.appendChild(c1);
  
  const c2 = document.createElement('div');
  c2.className = 'advice-card';
  c2.innerHTML = `
    <h3><span class="dot"></span>🌟 日常引导 · 鼓励为主</h3>
    <ul>
      <li>多表扬孩子的努力过程，不只夸"聪明"，保护他的探索兴趣。</li>
      <li>根据孩子的优势智能选择兴趣班：喜欢画画就报美术，爱运动就试试体能。</li>
      <li>每周安排亲子活动，在游戏中观察孩子的真实偏好。</li>
    </ul>
  `;
  list.appendChild(c2);
}

function restart(){
  G.qIndex = 0; G.answers = new Array(QUESTIONS.length).fill(null);
  showView('view-start');
}
document.getElementById('btnReport').onclick = ()=>showView('view-report');
window.addEventListener('resize', ()=>{ if(radarChart) radarChart.resize(); });
</script>
</body>
</html>
